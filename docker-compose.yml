name: resume-optimizer-copy
services:
  api:
    build: ./api
    container_name: ro-api-copy
    ports: ["127.0.0.1:8001:8000"]
    env_file: [.env]
    environment:
      RUNS_DIR: "/data/runs"
      EVALUATION_DIR: "/data/evaluation"
      EVALUATION_SOURCE_DIR: "/external/jds"
    volumes:
      - ./data/runs:/data/runs
      - ./data/datasets:/data/datasets
      - ./data/eval:/data/eval
      - ./data/evaluation:/data/evaluation
      - ./data/cache:/data/cache
      - ./data/jds:/external/jds:ro
      - hf_cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    container_name: ro-n8n-copy
    ports: ["127.0.0.1:5679:5678"]
    environment:
      N8N_HOST: "localhost"
      N8N_PORT: "5678"
      WEBHOOK_URL: "http://localhost:5679/"
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: "Asia/Kolkata"
      N8N_DIAGNOSTICS_ENABLED: "false"
      API_BASE: "http://api:8000"
      N8N_RUNNERS_TASK_TIMEOUT: "1800"
      EXECUTIONS_TIMEOUT: "1800"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data/runs:/data/runs
      - ./n8n/workflows:/workflows
    depends_on: [api]

volumes:
  n8n_data:
  hf_cache:
